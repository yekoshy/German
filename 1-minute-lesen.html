<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>1-Minute-Lesen – Lesetempo-Training</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary: #ff9f43;
      --primary-dark: #e68a2e;
      --secondary: #0abde3;
      --secondary-dark: #099ec0;
      --yellow: #ffcc00;
      --yellow-dark: #ffa000;
      --green: #1dd1a1;
      --green-dark: #10ac84;
      --red: #ff6b6b;
      --purple: #7158e2;
      --bg: #fdf6ec;
      --white: #ffffff;
      --text-dark: #2d3436;
      --text-muted: #636e72;
      --shadow-card: 0 10px 28px rgba(0, 0, 0, 0.08);
      --shadow-btn: 0 5px 0 rgba(0, 0, 0, 0.14);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: 'Baloo 2', 'Nunito', 'Comic Sans MS', sans-serif;
      background-color: var(--bg);
      color: var(--text-dark);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Kopfbereich */
    header {
      background: linear-gradient(135deg, #fff9e6 0%, #ffecb3 100%);
      border-bottom: 5px solid var(--yellow);
      padding: 14px 20px;
      box-shadow: 0 4px 14px rgba(255, 193, 7, 0.25);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header-inner {
      max-width: 960px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .timer-badge {
      background: var(--primary);
      color: #fff;
      font-size: 1.5rem;
      font-weight: 800;
      width: 64px;
      height: 64px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 4px solid #fff;
      box-shadow: 0 4px 12px rgba(255, 159, 67, 0.45);
    }

    h1 {
      margin: 0;
      font-size: 1.75rem;
      line-height: 1.1;
      color: #d35400;
    }

    .subtitle {
      font-size: 1rem;
      color: #5d4037;
      font-weight: 700;
    }

    /* Tabs */
    .nav-wrapper {
      max-width: 960px;
      width: 100%;
      margin: 16px auto 8px;
      padding: 0 16px;
    }

    .tabs {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .tab-btn {
      flex: 1 1 180px;
      background: var(--white);
      border: 3px solid #e0e6ed;
      border-radius: 20px;
      padding: 12px 18px;
      font-family: inherit;
      font-size: 1.15rem;
      font-weight: 800;
      color: var(--text-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s ease;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.05);
    }

    .tab-btn:hover {
      border-color: var(--secondary);
      transform: translateY(-2px);
    }

    .tab-btn.active {
      background: var(--yellow);
      color: #4e342e;
      border-color: var(--yellow-dark);
      box-shadow: 0 6px 14px rgba(255, 160, 0, 0.35);
      transform: translateY(-2px);
    }

    /* Hauptbereich */
    main {
      max-width: 960px;
      width: 100%;
      margin: 0 auto 40px;
      padding: 8px 16px;
      flex: 1;
    }

    .tab-panel {
      display: none;
      animation: fadeIn 0.3s ease;
    }

    .tab-panel.active {
      display: block;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .card {
      background: var(--white);
      border-radius: 28px;
      padding: 28px;
      box-shadow: var(--shadow-card);
      border: 4px solid #f1f4f8;
      text-align: center;
    }

    /* Erklärungsbox */
    .explanation-box {
      background: #f0f9ff;
      border: 3px solid #bae6fd;
      border-radius: 20px;
      padding: 20px 24px;
      text-align: left;
      margin: 18px 0 24px;
    }

    .explanation-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 10px;
    }

    .explanation-header h3 {
      margin: 0;
      font-size: 1.35rem;
      color: #0369a1;
    }

    .explanation-box ul {
      margin: 8px 0 0;
      padding-left: 22px;
      font-size: 1.12rem;
      line-height: 1.65;
    }

    /* 3-Runden-Übersicht */
    .rounds-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 12px;
      margin: 20px 0 24px;
    }

    .round-box {
      background: #f8f9fa;
      border: 3px solid #e2e8f0;
      border-radius: 18px;
      padding: 14px 10px;
      transition: all 0.2s;
    }

    .round-box.done {
      background: #ecfdf5;
      border-color: var(--green);
    }

    .round-box.current {
      background: #fffbeb;
      border-color: var(--yellow-dark);
      box-shadow: 0 0 12px rgba(255, 193, 7, 0.35);
    }

    .round-box.best-box {
      background: linear-gradient(135deg, #fff9c4 0%, #ffe082 100%);
      border-color: #ffb300;
    }

    .round-label {
      font-size: 1rem;
      font-weight: 800;
      color: var(--text-muted);
    }

    .round-score {
      font-size: 1.9rem;
      font-weight: 800;
      color: var(--text-dark);
      margin-top: 4px;
    }

    /* Buttons */
    .btn {
      background: var(--secondary);
      color: var(--white);
      border: none;
      border-radius: 20px;
      padding: 14px 26px;
      font-family: inherit;
      font-size: 1.2rem;
      font-weight: 800;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      box-shadow: var(--shadow-btn);
      transition: transform 0.15s, background-color 0.2s;
    }

    .btn:hover {
      transform: translateY(-2px);
      background: var(--secondary-dark);
    }

    .btn:active {
      transform: translateY(3px);
      box-shadow: 0 2px 0 rgba(0, 0, 0, 0.14);
    }

    .btn-primary {
      background: var(--primary);
    }

    .btn-primary:hover {
      background: var(--primary-dark);
    }

    .btn-green {
      background: var(--green-dark);
    }

    .btn-green:hover {
      background: #0d8a6a;
    }

    .btn-gray {
      background: #95a5a6;
    }

    .btn-gray:hover {
      background: #7f8c8d;
    }

    .btn-small {
      padding: 8px 16px;
      font-size: 1rem;
      border-radius: 14px;
    }

    /* Modus-Auswahl */
    .order-toggle {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: #f1f2f6;
      padding: 8px 16px;
      border-radius: 16px;
      margin-bottom: 20px;
      font-weight: 700;
      font-size: 1.05rem;
    }

    .order-toggle select {
      font-family: inherit;
      font-size: 1.05rem;
      font-weight: 700;
      padding: 6px 12px;
      border-radius: 10px;
      border: 2px solid #cbd5e1;
      background: #fff;
      cursor: pointer;
    }

    /* Spiel-Ansicht */
    .round-pill {
      display: inline-block;
      background: var(--purple);
      color: #fff;
      padding: 6px 18px;
      border-radius: 999px;
      font-size: 1.1rem;
      font-weight: 800;
      margin-bottom: 14px;
    }

    .timer-bar-container {
      width: 100%;
      height: 22px;
      background-color: #edf2f7;
      border-radius: 12px;
      overflow: hidden;
      border: 2px solid #e2e8f0;
      margin-bottom: 8px;
    }

    .timer-bar {
      height: 100%;
      width: 100%;
      background-color: var(--green);
      transition: width 1s linear, background-color 0.4s;
    }

    .time-text {
      font-size: 1.6rem;
      font-weight: 800;
      margin-bottom: 16px;
      color: var(--text-dark);
    }

    .word-display {
      font-size: clamp(2.4rem, 7vw, 4rem);
      font-weight: 800;
      margin: 24px 0;
      padding: 48px 20px;
      background-color: #f8fafc;
      border-radius: 26px;
      border: 5px dashed var(--secondary);
      cursor: pointer;
      user-select: none;
      transition: transform 0.1s, background-color 0.15s;
      position: relative;
      word-break: break-word;
    }

    .word-display:hover {
      background-color: #f0f9ff;
    }

    .word-display:active {
      transform: scale(0.97);
    }

    .word-number-tag {
      position: absolute;
      top: 12px;
      left: 18px;
      font-size: 1rem;
      font-weight: 800;
      color: #64748b;
      background: #e2e8f0;
      padding: 2px 12px;
      border-radius: 12px;
    }

    .score-display {
      font-size: 1.35rem;
      font-weight: 800;
      color: var(--text-muted);
      margin-bottom: 12px;
    }

    .game-actions {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 18px;
    }

    /* Ergebnis-Ansicht */
    .stars {
      font-size: 3.2rem;
      margin: 14px 0;
    }

    .advice-box {
      background-color: #e8f8f5;
      border-left: 6px solid var(--green-dark);
      padding: 16px 20px;
      border-radius: 0 16px 16px 0;
      margin: 20px 0;
      font-size: 1.15rem;
      font-weight: 700;
      text-align: left;
    }

    /* Wörterbuch */
    .dict-controls {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 18px;
    }

    .dict-filter-btns {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .filter-btn {
      background: #f1f5f9;
      border: 2px solid #cbd5e1;
      border-radius: 14px;
      padding: 8px 16px;
      font-family: inherit;
      font-size: 1rem;
      font-weight: 800;
      color: var(--text-dark);
      cursor: pointer;
    }

    .filter-btn.active {
      background: var(--secondary);
      color: #fff;
      border-color: var(--secondary-dark);
    }

    .search-input {
      flex: 1 1 220px;
      max-width: 320px;
      padding: 10px 16px;
      border-radius: 14px;
      border: 3px solid #cbd5e1;
      font-family: inherit;
      font-size: 1.05rem;
      font-weight: 700;
      outline: none;
    }

    .search-input:focus {
      border-color: var(--secondary);
    }

    .dictionary-wrapper {
      overflow-x: auto;
      border-radius: 20px;
      border: 3px solid #e2e8f0;
      background: #fff;
    }

    .dict-table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }

    .dict-table th {
      background: #fff9c4;
      color: #5d4037;
      padding: 14px 12px;
      font-size: 1.1rem;
      font-weight: 800;
      border-bottom: 3px solid #ffe082;
      white-space: nowrap;
    }

    .dict-table td {
      padding: 11px 12px;
      border-bottom: 2px solid #f1f5f9;
      font-size: 1.12rem;
      vertical-align: middle;
    }

    .dict-table tr:hover {
      background-color: #f8fdff;
    }

    .dict-num {
      color: #64748b;
      font-weight: 800;
      width: 48px;
      text-align: center;
    }

    .dict-de {
      font-weight: 800;
      color: #1e293b;
      font-size: 1.2rem;
    }

    .dict-en {
      font-weight: 700;
      color: #334155;
    }

    .dict-ar {
      font-size: 1.3rem;
      font-weight: 700;
      color: #1b5e20;
      direction: rtl;
      text-align: right;
    }

    .audio-cell {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .mini-audio-btn {
      background: #e0f2fe;
      color: #0369a1;
      border: 2px solid #7dd3fc;
      border-radius: 12px;
      padding: 5px 10px;
      font-family: inherit;
      font-size: 0.9rem;
      font-weight: 800;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: transform 0.1s, background-color 0.15s;
    }

    .mini-audio-btn:hover {
      background: var(--secondary);
      color: #fff;
      border-color: var(--secondary-dark);
      transform: scale(1.05);
    }

    .mini-audio-btn.all-btn {
      background: #dcfce7;
      color: #15803d;
      border-color: #86efac;
    }

    .mini-audio-btn.all-btn:hover {
      background: var(--green-dark);
      color: #fff;
      border-color: var(--green-dark);
    }

    /* Konfetti */
    #confettiCanvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 9999;
    }

    @media (max-width: 650px) {
      .card { padding: 18px; }
      h1 { font-size: 1.4rem; }
      .timer-badge { width: 52px; height: 52px; font-size: 1.25rem; }
      .word-display { padding: 36px 14px; }
      .dict-table th, .dict-table td { padding: 9px 8px; font-size: 1rem; }
    }
  </style>
</head>
<body>

  <canvas id="confettiCanvas"></canvas>

  <header>
    <div class="header-inner">
      <div class="brand">
        <div class="timer-badge">01:00</div>
        <div>
          <h1>1-Minute-Lesen ⏱️</h1>
          <div class="subtitle">Stufe 1 – Wortebene • 3 Runden &amp; Bestleistung</div>
        </div>
      </div>
      <button class="btn btn-small" onclick="speakText('Hallo! Bereit für das 1-Minute-Lesen? Wähle eine Karte und starte Runde 1!', 'de-DE')">
        🔊 Begrüßung
      </button>
    </div>
  </header>

  <div class="nav-wrapper">
    <div class="tabs">
      <button class="tab-btn active" data-tab="karte2" onclick="switchTab('karte2')">
        📄 Karte 2 (Seite 1)
      </button>
      <button class="tab-btn" data-tab="karte3" onclick="switchTab('karte3')">
        📄 Karte 3 (Seite 2)
      </button>
      <button class="tab-btn" data-tab="dict" onclick="switchTab('dict')">
        📚 Wörterbuch
      </button>
    </div>
  </div>

  <main>
    <!-- TAB 1: KARTE 2 -->
    <section id="panel-karte2" class="tab-panel active">
      <div class="card" id="container-karte2"></div>
    </section>

    <!-- TAB 2: KARTE 3 -->
    <section id="panel-karte3" class="tab-panel">
      <div class="card" id="container-karte3"></div>
    </section>

    <!-- TAB 3: WÖRTERBUCH -->
    <section id="panel-dict" class="tab-panel">
      <div class="card">
        <h2 style="margin-top: 0; color: #0369a1;">📚 Wörterbuch – Deutsch, Englisch &amp; Arabisch</h2>
        <p style="color: var(--text-muted); font-weight: 700; margin-top: 0;">
          Hier findest du alle 200 Wörter aus Karte 2 und Karte 3 mit Bedeutung und Vorlesefunktion.
        </p>

        <div class="dict-controls">
          <div class="dict-filter-btns">
            <button class="filter-btn active" data-filter="karte2" onclick="setDictFilter('karte2')">Karte 2 (1–100)</button>
            <button class="filter-btn" data-filter="karte3" onclick="setDictFilter('karte3')">Karte 3 (1–100)</button>
            <button class="filter-btn" data-filter="all" onclick="setDictFilter('all')">Alle 200 Wörter</button>
          </div>
          <input type="text" id="dictSearch" class="search-input" placeholder="🔍 Wort suchen (DE / EN / AR)..." oninput="renderDictionary()">
        </div>

        <div class="dictionary-wrapper">
          <table class="dict-table">
            <thead>
              <tr>
                <th style="text-align: center;">Nr.</th>
                <th>Deutsch</th>
                <th>Englisch</th>
                <th style="text-align: right;">Arabisch</th>
                <th>Vorlesen</th>
              </tr>
            </thead>
            <tbody id="dictTableBody"></tbody>
          </table>
        </div>
      </div>
    </section>
  </main>

  <script>

       1. WORTLISTEN AUS DEM PDF (KARTE 2 & KARTE 3, JE 100 WÖRTER)
       ========================================================= */

    /* =========================================================
       3. SPRACHAUSGABE (TEXT-TO-SPEECH)
       ========================================================= */
    function speakText(text, lang = 'de-DE', rate = 0.9, onEnd = null) {
      if (!('speechSynthesis' in window)) {
        if (onEnd) onEnd();
        return;
      }
      try {
        window.speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(text);
        u.lang = lang;
        u.rate = rate;
        u.pitch = 1.05;
        if (onEnd) {
          u.onend = onEnd;
          u.onerror = onEnd;
        }
        window.speechSynthesis.speak(u);
      } catch (e) {
        if (onEnd) onEnd();
      }
    }

    function speakTrilingual(deText, enText, arText) {
      speakText(deText, 'de-DE', 0.9, () => {
        setTimeout(() => {
          speakText(enText, 'en-US', 0.9, () => {
            setTimeout(() => {
              speakText(arText, 'ar-SA', 0.85);
            }, 350);
          });
        }, 350);
      });
    }

    function speakExplanation(cardTitle) {
      const text = `Willkommen beim 1-Minute-Lesen für ${cardTitle}. Du hast pro Runde genau eine Minute Zeit. Lies jedes Wort laut und deutlich vor. Tippe danach auf das Wort oder drücke die Leertaste, um zum nächsten Wort zu kommen. Du machst insgesamt drei Runden. Am Ende zählt dein bestes Ergebnis!`;
      speakText(text, 'de-DE', 0.95);
    }

    /* =========================================================
       4. TAB-WECHSEL
       ========================================================= */
    function switchTab(tabId) {
      // Laufende Timer beim Tab-Wechsel sauber anhalten/abbrechen
      ['karte2', 'karte3'].forEach(id => {
        const st = cardStates[id];
        if (st.phase === 'playing') {
          clearInterval(st.timerId);
          st.timerId = null;
          st.phase = 'intro';
          renderCard(id);
        }
      });

      activeTab = tabId;
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.tab === tabId);
      });
      document.querySelectorAll('.tab-panel').forEach(panel => {
        panel.classList.toggle('active', panel.id === 'panel-' + tabId);
      });

      if (tabId === 'dict') {
        renderDictionary();
      }
    }

    /* =========================================================
       5. LOGIK FÜR KARTE 2 & KARTE 3 (3 RUNDEN A 60 SEKUNDEN)
       ========================================================= */
    function getBestScore(scores) {
      const valid = scores.filter(s => s !== null);
      return valid.length ? Math.max(...valid) : null;
    }

    function renderRoundsTracker(st) {
      const best = getBestScore(st.scores);
      return `
        <div class="rounds-grid">
          ${[0, 1, 2].map(i => {
            const val = st.scores[i];
            const isDone = val !== null;
            const isCurrent = st.phase !== 'finalResult' && i === st.currentRound;
            return `
              <div class="round-box ${isDone ? 'done' : ''} ${isCurrent ? 'current' : ''}">
                <div class="round-label">Runde ${i + 1}</div>
                <div class="round-score">${isDone ? val + ' Wörter' : '—'}</div>
              </div>
            `;
          }).join('')}
          <div class="round-box best-box">
            <div class="round-label">🏆 Bestes Ergebnis</div>
            <div class="round-score">${best !== null ? best + ' Wörter' : '—'}</div>
          </div>
        </div>
      `;
    }

    function renderCard(cardId) {
      const st = cardStates[cardId];
      const container = document.getElementById('container-' + cardId);

      if (st.phase === 'intro') {
        const nextRoundNum = st.currentRound + 1;
        container.innerHTML = `

              <li>Du machst insgesamt <strong>3 Runden</strong> (Runde 1, Runde 2 und Runde 3).</li>

            </ul>
          </div>

          ${renderRoundsTracker(st)}

          <div class="order-toggle">

          </div>

          <div style="display: flex; justify-content: center; gap: 14px; flex-wrap: wrap;">

                🔄 Alle Runden zurücksetzen
              </button>
            ` : ''}
          </div>
        `;
      } else if (st.phase === 'playing') {
        const currentWord = st.sessionWords[st.wordIndex];

        if (st.timeLeft <= 10) barColor = 'var(--red)';

          <div id="word-display-${cardId}" class="word-display" onclick="nextWord('${cardId}')">

              ⏹️ Runde abbrechen
            </button>
          </div>

      } else if (st.phase === 'roundResult') {
        const score = st.scores[st.currentRound];
        const finishedRoundNum = st.currentRound + 1;
        const nextRoundNum = finishedRoundNum + 1;

        container.innerHTML = `
          <h2 style="margin-top: 0; color: var(--secondary-dark); font-size: 2rem;">

        const best = getBestScore(st.scores);

          </div>
        `;

    function setOrderMode(cardId, mode) {
      cardStates[cardId].orderMode = mode;
    }

    function startRound(cardId) {
      const st = cardStates[cardId];
      clearInterval(st.timerId);

      st.sessionWords = st.orderMode === 'random'
        ? [...st.words].sort(() => Math.random() - 0.5)
        : [...st.words];
      st.wordIndex = 0;
      st.timeLeft = ROUND_SECONDS;
      st.phase = 'playing';

      renderCard(cardId);

      st.timerId = setInterval(() => {
        st.timeLeft--;
        updateTimerUI(cardId);
        if (st.timeLeft <= 0) {
          finishRound(cardId, false);
        }
      }, 1000);
    }

    function updateTimerUI(cardId) {
      const st = cardStates[cardId];
      const bar = document.getElementById('timer-bar-' + cardId);
      const txt = document.getElementById('time-text-' + cardId);
      if (!bar || !txt) return;

      const pct = Math.max(0, (st.timeLeft / ROUND_SECONDS) * 100);
      bar.style.width = pct + '%';
      txt.textContent = st.timeLeft + (st.timeLeft === 1 ? ' Sekunde' : ' Sekunden');

      if (st.timeLeft <= 20) bar.style.backgroundColor = '#f1c40f';
      if (st.timeLeft <= 10) bar.style.backgroundColor = 'var(--red)';
    }

    function nextWord(cardId) {
      const st = cardStates[cardId];
      if (st.phase !== 'playing') return;

      st.wordIndex++;
      if (st.wordIndex >= st.sessionWords.length) {
        finishRound(cardId, true);
        return;
      }

      const currentWord = st.sessionWords[st.wordIndex];
      const box = document.getElementById('word-display-' + cardId);
      const scoreEl = document.getElementById('score-' + cardId);
      if (box && scoreEl) {
        box.innerHTML = `
          <span class="word-number-tag">Nr. ${currentWord.n}</span>
          <span id="word-text-${cardId}">${currentWord.de}</span>
        `;
        scoreEl.textContent = st.wordIndex;
      }
    }

    function speakCurrentWord(cardId) {
      const st = cardStates[cardId];
      if (st.phase !== 'playing') return;
      const word = st.sessionWords[st.wordIndex];
      if (word) speakText(word.de, 'de-DE', 0.85);
    }

    function cancelRound(cardId) {
      const st = cardStates[cardId];
      clearInterval(st.timerId);
      st.timerId = null;
      st.phase = 'intro';
      renderCard(cardId);
    }

    function finishRound(cardId, finishedAll) {
      const st = cardStates[cardId];
      clearInterval(st.timerId);
      st.timerId = null;

      const score = st.wordIndex;
      st.scores[st.currentRound] = score;

      if (st.currentRound < 2) {
        st.phase = 'roundResult';
        renderCard(cardId);
        speakText(`Runde ${st.currentRound + 1} beendet! Du hast ${score} Wörter gelesen.`, 'de-DE');
      } else {
        st.phase = 'finalResult';
        renderCard(cardId);
        triggerConfetti(80);
        const best = getBestScore(st.scores);
        speakText(`Super! Alle drei Runden geschafft! Dein bestes Ergebnis sind ${best} Wörter.`, 'de-DE');
      }
    }

    function prepareNextRound(cardId) {
      const st = cardStates[cardId];
      st.currentRound++;
      st.phase = 'intro';
      renderCard(cardId);
    }

    function resetAllRounds(cardId) {
      const st = cardStates[cardId];
      clearInterval(st.timerId);
      st.timerId = null;
      st.currentRound = 0;
      st.scores = [null, null, null];
      st.phase = 'intro';
      renderCard(cardId);
    }

    function getStars(score) {
      if (score >= 70) return '⭐⭐⭐⭐⭐';
      if (score >= 50) return '⭐⭐⭐⭐';
      if (score >= 30) return '⭐⭐⭐';
      if (score >= 15) return '⭐⭐';
      return '⭐';
    }

    function getRoundFeedback(score, roundNum) {
      if (score < 20) {
        return `Ein super Start in Runde ${roundNum}! Versuche gleich in der nächsten Runde noch ein paar Wörter mehr zu schaffen.`;
      }
      if (score < 45) {
        return `Toll gelesen in Runde ${roundNum}! Du kennst viele Wörter schon richtig schnell. Schaffst du in Runde ${roundNum + 1} noch mehr?`;
      }
      return `Wahnsinn! ${score} Wörter in nur einer Minute! Mal sehen, ob du diesen Rekord in der nächsten Runde noch übertreffen kannst!`;
    }

    function getFinalFeedback(best) {
      if (best < 20) {
        return `Klasse durchgehalten! Tipp: Schaue dir schwierige Wörter im Wörterbuch an, höre sie dir an und starte die 3 Runden noch einmal.`;
      }
      if (best < 45) {
        return `Richtig stark! Mit ${best} Wörtern bist du schon sehr sicher unterwegs. Übung macht den Lese-Meister!`;
      }
      if (best < 75) {
        return `Super schnell gelesen! ${best} Wörter in einer Minute sind ein tolles Ergebnis. Probiere jetzt auch die nächste Karte aus!`;
      }
      return `Unglaublich! ${best} Wörter in 60 Sekunden – du bist ein echter Lese-Profi!`;
    }

    // Tastatur-Steuerung (Leertaste oder Enter für nächstes Wort während einer aktiven Runde)
    document.addEventListener('keydown', (e) => {
      if (activeTab === 'karte2' || activeTab === 'karte3') {
        const st = cardStates[activeTab];
        if (st.phase === 'playing' && (e.code === 'Space' || e.code === 'Enter')) {
          e.preventDefault();
          nextWord(activeTab);
        }
      }
    });

    /* =========================================================
       6. WÖRTERBUCH (DEUTSCH – ENGLISCH – ARABISCH + AUDIO)
       ========================================================= */
    function setDictFilter(filter) {
      dictFilter = filter;
      document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.filter === filter);
      });
      renderDictionary();
    }

    function renderDictionary() {
      const tbody = document.getElementById('dictTableBody');
      const query = (document.getElementById('dictSearch').value || '').trim().toLowerCase();

      let list = [];
      if (dictFilter === 'karte2') {
        list = KARTE_2_WORDS.map(w => ({ ...w, card: 'K2' }));
      } else if (dictFilter === 'karte3') {
        list = KARTE_3_WORDS.map(w => ({ ...w, card: 'K3' }));
      } else {
        list = [
          ...KARTE_2_WORDS.map(w => ({ ...w, card: 'K2' })),
          ...KARTE_3_WORDS.map(w => ({ ...w, card: 'K3' }))
        ];
      }

      if (query) {
        list = list.filter(w =>
          w.de.toLowerCase().includes(query) ||
          w.en.toLowerCase().includes(query) ||
          w.ar.includes(query)
        );
      }

      if (list.length === 0) {
        tbody.innerHTML = `
          <tr>
            <td colspan="5" style="text-align: center; padding: 28px; color: var(--text-muted); font-weight: 700;">
              Kein passendes Wort gefunden.
            </td>
          </tr>
        `;
        return;
      }

      tbody.innerHTML = list.map(w => {
        const safeDe = w.de.replace(/'/g, "\\'");
        const safeEn = w.en.replace(/'/g, "\\'");
        const safeAr = w.ar.replace(/'/g, "\\'");
        const prefix = dictFilter === 'all' ? `${w.card} #${w.n}` : w.n;

        return `
          <tr>
            <td class="dict-num">${prefix}</td>
            <td class="dict-de">${w.de}</td>
            <td class="dict-en">${w.en}</td>
            <td class="dict-ar">${w.ar}</td>
            <td>
              <div class="audio-cell">
                <button class="mini-audio-btn" title="Deutsch vorlesen" onclick="speakText('${safeDe}', 'de-DE')">🔊 DE</button>
                <button class="mini-audio-btn" title="Englisch vorlesen" onclick="speakText('${safeEn}', 'en-US')">🔊 EN</button>
                <button class="mini-audio-btn" title="Arabisch vorlesen" onclick="speakText('${safeAr}', 'ar-SA')">🔊 AR</button>
                <button class="mini-audio-btn all-btn" title="Alle 3 Sprachen vorlesen" onclick="speakTrilingual('${safeDe}', '${safeEn}', '${safeAr}')">🌍 Alle</button>
              </div>
            </td>
          </tr>
        `;
      }).join('');
    }

    /* =========================================================
       7. KONFETTI-ANIMATION
       ========================================================= */
    const canvas = document.getElementById('confettiCanvas');
    const ctx = canvas.getContext('2d');
    let confettiParticles = [];
    let animId = null;

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function triggerConfetti(count = 70) {
      const colors = ['#ff6b6b', '#ffcc00', '#1dd1a1', '#0abde3', '#ff9f43', '#7158e2'];
      for (let i = 0; i < count; i++) {
        confettiParticles.push({
          x: canvas.width / 2 + (Math.random() - 0.5) * 260,
          y: canvas.height / 3 + (Math.random() - 0.5) * 100,
          w: Math.random() * 12 + 6,
          h: Math.random() * 8 + 4,
          color: colors[Math.floor(Math.random() * colors.length)],
          vx: (Math.random() - 0.5) * 14,
          vy: Math.random() * -12 - 4,
          tilt: Math.random() * 10,
          tiltSpeed: Math.random() * 0.1 + 0.05,
          gravity: 0.35,
          opacity: 1
        });
      }
      if (!animId) animateConfetti();
    }

    function animateConfetti() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      for (let i = confettiParticles.length - 1; i >= 0; i--) {
        const p = confettiParticles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vy += p.gravity;
        p.tilt += p.tiltSpeed;
        p.opacity -= 0.007;

        ctx.save();
        ctx.fillStyle = p.color;
        ctx.globalAlpha = Math.max(0, p.opacity);
        ctx.translate(p.x, p.y);
        ctx.rotate(p.tilt);
        ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
        ctx.restore();

        if (p.y > canvas.height || p.opacity <= 0) {
          confettiParticles.splice(i, 1);
        }
      }

      if (confettiParticles.length > 0) {
        animId = requestAnimationFrame(animateConfetti);
      } else {
        cancelAnimationFrame(animId);
        animId = null;
        ctx.clearRect(0, 0, canvas.width, canvas.height);
      }
    }

    /* =========================================================
       8. INITIALISIERUNG
       ========================================================= */
    window.addEventListener('DOMContentLoaded', () => {
      renderCard('karte2');
      renderCard('karte3');
      renderDictionary();
    });
  </script>
</body>
</html>
